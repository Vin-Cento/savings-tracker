services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Create servicer if it doesn't exist
        if ! psql -h db -U admin -d postgres -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname='servicer'" | grep -q 1; then
          psql -h db -U admin -d postgres -c \
            "CREATE USER servicer WITH PASSWORD 'password';"
        fi

        # Create savings_tracker if it doesn't exist
        if ! psql -h db -U admin -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='savings_tracker'" | grep -q 1; then
          psql -h db -U admin -d postgres -c \
            "CREATE DATABASE savings_tracker OWNER servicer;"
        fi

        # Make sure servicer owns the database
        psql -h db -U admin -d postgres -c \
          "ALTER DATABASE savings_tracker OWNER TO servicer;"

        echo "Database initialization complete."
